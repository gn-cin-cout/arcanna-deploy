{{- range .Values.children }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: 'wave-test-{{ .name }}'
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '{{ .wave }}'
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ $.Values.repoURL | quote }}
    targetRevision: {{ $.Values.targetRevision | quote }}
    path: 'charts/{{ .chart }}'
    helm:
      parameters:
        - name: runId
          value: {{ $.Values.runId | quote }}
  destination:
    server: {{ $.Values.destServer | quote }}
    namespace: {{ $.Values.destNamespace | quote }}
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
{{- end }}
