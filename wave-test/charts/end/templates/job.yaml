apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-job
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  labels:
    app: end
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: end
    spec:
      restartPolicy: Never
      containers:
        - name: end
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "end job running, runId={{ .Values.runId }}, timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
