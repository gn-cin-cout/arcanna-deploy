apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: arcanna-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/gn-cin-cout/arcanna-deploy.git
    targetRevision: main
    path: manifests
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true