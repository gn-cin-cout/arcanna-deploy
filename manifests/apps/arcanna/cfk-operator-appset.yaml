apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cfk-operator
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - cluster: trial
            url: https://kubernetes.default.svc
  template:
    metadata:
      name: '{{cluster}}-cfk-operator'
      annotations:
        argocd.argoproj.io/sync-wave: "-1"
    spec:
      project: default
      source:
        repoURL: https://packages.confluent.io/helm
        targetRevision: 0.1514.40
        chart: confluent-for-kubernetes
        helm:
          releaseName: confluent-operator
          values: |
            namespaced: true
            namespaceList:
              - arcanna
      destination:
        server: '{{url}}'
        namespace: arcanna
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        # automated:           # manual sync for operators (matches org convention)
        #   selfHeal: true
        #   prune: true