apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: eck-crds
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - cluster: trial
            url: https://kubernetes.default.svc
  template:
    metadata:
      name: '{{cluster}}-eck-crds'
      annotations:
        argocd.argoproj.io/sync-wave: "-2"
    spec:
      project: default
      source:
        repoURL: https://helm.elastic.co
        targetRevision: 3.4.0
        chart: eck-operator-crds
      destination:
        server: '{{url}}'
        namespace: arcanna   # CRDs are cluster-scoped; this only drives CreateNamespace + is an ArgoCD-required field
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        # automated:           # manual sync for operators (matches org convention)
        #   selfHeal: true
        #   prune: true